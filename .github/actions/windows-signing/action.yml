name: Windows signing
description: 导入代码签名证书并生成 Tauri 签名配置
inputs:
  certificate-base64:
    description: 包含私钥的 PFX 文件（纯 base64）
    required: true
  certificate-password:
    description: PFX 导出口令
    required: true
  timestamp-url:
    description: 证书颁发机构的 RFC 3161 时间戳服务
    required: false
    default: http://timestamp.digicert.com
outputs:
  config:
    description: 临时 Tauri 配置路径
    value: ${{ steps.configure.outputs.config }}
runs:
  using: composite
  steps:
    - name: Configure signing
      id: configure
      shell: pwsh
      env:
        WINDOWS_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        WINDOWS_TIMESTAMP_URL: ${{ inputs.timestamp-url }}
      run: '& "${{ github.action_path }}/configure.ps1"'
