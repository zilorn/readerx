# ReaderX Android 自动发版
#
# 触发：推送形如 v* 的 tag 时触发（按惯例 tag 打在 main 分支的提交上），
#       例如 `git tag v1.2.3 && git push origin v1.2.3`。
# 版本号：以 tag 名称为准（v1.2.3 -> 1.2.3）。
#
# 前置约定（发版前需在 main 上完成并提交）：
#   1. 仓库版本号与 tag 保持一致：
#        node scripts/bump-version.mjs 1.2.3        # 同步 package.json/tauri.conf.json/Cargo.toml/Cargo.lock
#   2. CHANGELOG.md 中已写好对应区块，例如：
#        ## [1.2.3] - 2026-09-04
# 工作流会校验以上两项，不一致直接失败，避免发布版本错乱的包。
#
# 签名（首次使用前配置一次）：
#   生成 keystore（key 与 store 口令建议不同）：
#     keytool -genkey -v -keystore readerx-release.keystore \
#       -alias readerx -keyalg RSA -keysize 2048 -validity 10000
#   在 Settings -> Secrets and variables -> Actions 配置：
#     ANDROID_KEYSTORE_BASE64    # keystore 文件 base64：base64 -w0 readerx-release.keystore
#     ANDROID_KEYSTORE_PASSWORD  # store 口令
#     ANDROID_KEY_ALIAS          # 别名（示例 readerx）
#     ANDROID_KEY_PASSWORD       # key 口令
#
# 产物：**一个 tag 出三个平台**，汇总到同一个 GitHub Release：
#   - Android：按 ABI 拆分的**签名** APK（arm64-v8a / armeabi-v7a / x86 / x86_64，不做 universal 融合包）；
#   - Linux x86_64：AppImage / deb / rpm（无代码签名证书，未签名）；
#   - Windows x86_64 / aarch64：各出一个 NSIS 安装包（无代码签名证书，未签名）
#     —— 与 Android 按 ABI 拆分同一个理由，ARM 机器不该装到靠模拟运行的 x64 包。
#   Release body 取 CHANGELOG.md 中与版本号对应的区块，并附一段未签名说明。

name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # tag 与仓库版本一致性：tag v1.2.3 要求 tauri.conf.json 版本同为 1.2.3，
  # 这样各平台产物里的版本号、Android 的 versionName/versionCode 才与 Release 一致。
  # 提成独立 job 是为了让三平台共用同一份校验结果（各写一遍迟早走偏）。
  validate:
    name: Validate tag against committed version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag against committed version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::tag 必须以 v 开头（如 v1.2.3），当前 tag：${TAG}"
            exit 1
          fi
          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} 对应版本 ${VERSION}，但仓库版本为 ${CONFIG_VERSION}。"
            echo "::error::请先在 main 上执行 node scripts/bump-version.mjs ${VERSION} 并提交，再打 tag。"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (app version ${VERSION})"

  release-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 依赖下载占 Android 构建的大头，缓存下来能省几分钟；
      # key 带上 gen/android 下的构建脚本 hash，脚本变了就重新拉依赖。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle', 'src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # GitHub 托管的 runner 预装了 Android SDK/NDK；选最高版本的 NDK 并导出，
      # tauri CLI 的 ensure_ndk 会优先读取 NDK_HOME（CI 下不会自行下载 NDK）。
      - name: Resolve Android SDK / NDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK_DIR="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::未在 ${ANDROID_HOME}/ndk 下找到 NDK，请先安装 NDK 或在 Actions runner 中配置。"
            exit 1
          fi
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "Using NDK: ${NDK_DIR}"

      # 仓库里 gradle.properties 提交了本机路径 org.gradle.java.home，替换为 runner 的 JDK。
      - name: Point Gradle at runner JDK
        run: |
          sed -i "s|^org\.gradle\.java\.home=.*|org.gradle.java.home=${JAVA_HOME}|" src-tauri/gen/android/gradle.properties
          grep '^org.gradle.java.home' src-tauri/gen/android/gradle.properties

      - name: Configure Android signing (secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 secrets。请在仓库 Settings -> Secrets and variables -> Actions 配置"
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-release.keystore"
          {
            echo "keyAlias=${KEY_ALIAS}"
            echo "password=${KEY_PASSWORD}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "storeFile=${RUNNER_TEMP}/android-release.keystore"
          } > src-tauri/gen/android/keystore.properties
          echo "Signing configured for alias ${KEY_ALIAS}"

      # --split-per-abi：跳过 universal 融合包，分别 assemble 每个 ABI 的 release APK，
      # 产物位于 app/build/outputs/apk/<flavor>/release/（flavor 对应 arm64/arm/x86/x86_64）。
      - name: Build signed per-ABI release APKs
        run: pnpm tauri android build --apk --split-per-abi --ci
        timeout-minutes: 90

      - name: Prepare per-ABI APK artifacts
        id: apk
        run: |
          set -euo pipefail
          declare -A ABI_OF=( [arm64]=arm64-v8a [arm]=armeabi-v7a [x86]=x86 [x86_64]=x86_64 )
          APKS=()
          for FLAVOR in arm64 arm x86 x86_64; do
            ABI="${ABI_OF[$FLAVOR]}"
            APK_DIR="src-tauri/gen/android/app/build/outputs/apk/${FLAVOR}/release"
            if [ -f "${APK_DIR}/app-${FLAVOR}-release-unsigned.apk" ]; then
              echo "::error::${ABI} 产物未签名（app-${FLAVOR}-release-unsigned.apk）。请检查签名步骤与 app/build.gradle.kts 的 signingConfigs。"
              exit 1
            fi
            APK="${APK_DIR}/app-${FLAVOR}-release.apk"
            if [ ! -f "$APK" ]; then
              APK="$(find "${APK_DIR}" -maxdepth 1 -name '*.apk' 2>/dev/null | head -n 1)"
            fi
            if [ -z "$APK" ]; then
              echo "::error::未找到 ${ABI} 的 release APK（期望 ${APK_DIR}/）。请检查 --split-per-abi 构建产物。"
              exit 1
            fi
            DEST="$RUNNER_TEMP/readerx-${VERSION}-${ABI}.apk"
            cp "$APK" "$DEST"
            APKS+=("$DEST")
            echo "APK artifact [${ABI}]: ${DEST}"
          done
          # 跨步骤传递：换行分隔写入临时文件，发布步骤按行还原
          printf '%s\n' "${APKS[@]}" > "$RUNNER_TEMP/apk-paths.txt"
          echo "Prepared ${#APKS[@]} per-ABI APKs"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          # 只上传最终 APK：文件名里带版本与 ABI，发布时无需再改名
          path: ${{ runner.temp }}/readerx-*.apk
          if-no-files-found: error

  release-desktop:
    name: Build desktop bundles (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 是 Linux 产物的兼容基线（见 build-desktop.yml 的说明）
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # ARM 笔记本（骁龙 X 等）：单独出包，不要让用户装到靠模拟运行的 x64 包
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}

      - name: Build desktop bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        timeout-minutes: 70

      # 产物在 target/<目标三平台名>/release/bundle/ 下：各架构互不覆盖，发布时按文件名区分
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, release-android, release-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 各平台产物先汇总再发布：`gh release create` 只跑一次，避免多个 job 抢同一个 release。
      # 下载后按 artifact 名分目录（desktop-windows-x86_64/ 等），保留「这份包来自哪个架构」，
      # 下面的发布步骤据此在重名时补 ABI 后缀。
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/assets

      # 发布说明 = scripts/tip.md（下载与安装说明，含各平台 / 架构与签名情况）+ CHANGELOG 对应区块，
      # 拼接由 scripts/release-notes.mjs 负责：安装说明是随产物走的文案，改它不必动工作流。
      - name: Build release notes
        run: |
          node scripts/release-notes.mjs "${VERSION}" > "$RUNNER_TEMP/release-notes.md"
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-assets"
          mkdir -p "$STAGE"
          mapfile -t FOUND < <(find "$RUNNER_TEMP/assets" -type f \
            \( -name '*.apk' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' \) | sort)
          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "::error::没有找到任何可发布的产物，检查各构建 job 的上传步骤。"
            exit 1
          fi
          # 不同 ABI 的桌面包可能重名：同一个 Release 里必须先区分开，否则 GitHub 会以后上传的
          # 覆盖先上传的，用户拿到的架构就错了。重名时补上来路目录里的架构（x86_64 / aarch64）。
          mapfile -t BASENAMES < <(printf '%s\n' "${FOUND[@]}" | xargs -n1 basename)
          ASSETS=()
          for FILE in "${FOUND[@]}"; do
            NAME="$(basename "$FILE")"
            ARCH="$(basename "$(dirname "$FILE")")"
            if [ "$(printf '%s\n' "${BASENAMES[@]}" | grep -cx "$NAME")" -gt 1 ]; then
              NAME="${NAME%.*}-${ARCH#*-}.${NAME##*.}"
            fi
            cp "$FILE" "$STAGE/$NAME"
            ASSETS+=("$STAGE/$NAME")
            echo "asset: $NAME"
          done
          PRERELEASE=""
          case "${VERSION}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${TAG}" "${ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ${PRERELEASE}
          echo "Released ${TAG} with ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"
