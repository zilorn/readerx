# ReaderX Android 自动发版
#
# 触发：推送形如 v* 的 tag 时触发（按惯例 tag 打在 main 分支的提交上），
#       例如 `git tag v1.2.3 && git push origin v1.2.3`。
# 版本号：以 tag 名称为准（v1.2.3 -> 1.2.3）。
#
# 前置约定（发版前需在 main 上完成并提交）：
#   1. 仓库版本号与 tag 保持一致：
#        node scripts/bump-version.mjs 1.2.3        # 同步 package.json/tauri.conf.json/Cargo.toml/Cargo.lock
#   2. CHANGELOG.md 中已写好对应区块，例如：
#        ## [1.2.3] - 2026-09-04
# 版本号一致性由工作流校验，不一致直接失败，避免发布版本错乱的包；CHANGELOG 漏写本版条目不会
# 让工作流失败，发布说明会回退到 [Unreleased] 区块（口径见 scripts/release-notes.mjs）。
#
# 签名（首次使用前配置一次）：
#   生成 keystore（key 与 store 口令建议不同）：
#     keytool -genkey -v -keystore readerx-release.keystore \
#       -alias readerx -keyalg RSA -keysize 2048 -validity 10000
#   在 Settings -> Secrets and variables -> Actions 配置：
#     ANDROID_KEYSTORE_BASE64    # keystore 文件 base64：base64 -w0 readerx-release.keystore
#     ANDROID_KEYSTORE_PASSWORD  # store 口令
#     ANDROID_KEY_ALIAS          # 别名（示例 readerx）
#     ANDROID_KEY_PASSWORD       # key 口令
#
# 产物：**一个 tag 出三个平台**，汇总到同一个 GitHub Release：
#   - Android：按 ABI 拆分的**签名** APK（arm64-v8a / armeabi-v7a / x86 / x86_64，不做 universal 融合包）；
#   - Linux x86_64：AppImage / deb / rpm（无代码签名证书，未签名）；
#   - Windows x86_64 / aarch64：各出一个 NSIS 安装包（无代码签名证书，未签名）
#     —— 与 Android 按 ABI 拆分同一个理由，ARM 机器不该装到靠模拟运行的 x64 包。
#   产物文件名统一成 `readerx-<版本>-<平台>-<架构>…`（如 readerx-1.2.3-windows-aarch64-setup.exe），
#   用户在下载列表里就能分清平台与架构；口径集中在 scripts/collect-artifacts.mjs，
#   构建 job 收集时改名，发布 job 只按文件名收。
#   Release body 取 CHANGELOG.md 中与版本号对应的区块（缺失时回退到 [Unreleased]），并附一段未签名说明。

name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # tag 与仓库版本一致性：tag v1.2.3 要求 tauri.conf.json 版本同为 1.2.3，
  # 这样各平台产物里的版本号、Android 的 versionName/versionCode 才与 Release 一致。
  # 提成独立 job 是为了让三平台共用同一份校验结果（各写一遍迟早走偏）。
  validate:
    name: Validate tag against committed version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag against committed version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::tag 必须以 v 开头（如 v1.2.3），当前 tag：${TAG}"
            exit 1
          fi
          CONFIG_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} 对应版本 ${VERSION}，但仓库版本为 ${CONFIG_VERSION}。"
            echo "::error::请先在 main 上执行 node scripts/bump-version.mjs ${VERSION} 并提交，再打 tag。"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (app version ${VERSION})"

  release-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 依赖下载占 Android 构建的大头，缓存下来能省几分钟；
      # key 带上 gen/android 下的构建脚本 hash，脚本变了就重新拉依赖。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle', 'src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # GitHub 托管的 runner 预装了 Android SDK/NDK；选最高版本的 NDK 并导出，
      # tauri CLI 的 ensure_ndk 会优先读取 NDK_HOME（CI 下不会自行下载 NDK）。
      - name: Resolve Android SDK / NDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          NDK_DIR="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "::error::未在 ${ANDROID_HOME}/ndk 下找到 NDK，请先安装 NDK 或在 Actions runner 中配置。"
            exit 1
          fi
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "Using NDK: ${NDK_DIR}"

      # 仓库里 gradle.properties 提交了本机路径 org.gradle.java.home，替换为 runner 的 JDK。
      - name: Point Gradle at runner JDK
        run: |
          sed -i "s|^org\.gradle\.java\.home=.*|org.gradle.java.home=${JAVA_HOME}|" src-tauri/gen/android/gradle.properties
          grep '^org.gradle.java.home' src-tauri/gen/android/gradle.properties

      - name: Configure Android signing (secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少签名 secrets。请在仓库 Settings -> Secrets and variables -> Actions 配置"
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-release.keystore"
          {
            echo "keyAlias=${KEY_ALIAS}"
            echo "password=${KEY_PASSWORD}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "storeFile=${RUNNER_TEMP}/android-release.keystore"
          } > src-tauri/gen/android/keystore.properties
          echo "Signing configured for alias ${KEY_ALIAS}"

      # --split-per-abi：跳过 universal 融合包，分别 assemble 每个 ABI 的 release APK，
      # 产物位于 app/build/outputs/apk/<flavor>/release/（flavor 对应 arm64/arm/x86/x86_64）。
      - name: Build signed per-ABI release APKs
        run: pnpm tauri android build --apk --split-per-abi --ci
        timeout-minutes: 90

      # 统一改名成 readerx-<版本>-android-<ABI>.apk（见 scripts/collect-artifacts.mjs）：
      # 四个 ABI 必须齐全、且不接受未签名产物，否则当场失败。
      # 输出目录写 ${{ runner.temp }}，与下面上传步骤的 path 同一个口径（理由见 desktop job 的注释）
      - name: Collect signed per-ABI APKs
        run: node scripts/collect-artifacts.mjs android --out "${{ runner.temp }}/artifacts"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readerx-android-apks
          # 只上传最终 APK：文件名里带版本与 ABI，发布时无需再改名
          path: ${{ runner.temp }}/artifacts/*.apk
          if-no-files-found: error

  release-desktop:
    name: Build desktop bundles (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 是 Linux 产物的兼容基线（见 build-desktop.yml 的说明）
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # ARM 笔记本（骁龙 X 等）：单独出包，不要让用户装到靠模拟运行的 x64 包
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          rust-targets: ${{ matrix.target }}

      - name: Build desktop bundles
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        timeout-minutes: 70

      # 产物在 target/<目标三平台名>/release/bundle/ 下，各架构互不覆盖；
      # 收集时统一改名成「平台-架构」口径（见 scripts/collect-artifacts.mjs），
      # 于是发布步骤只按文件收，不必再按来路目录猜架构。
      #
      # 输出目录一律写 ${{ runner.temp }}（runner 在把脚本交给 shell 之前就展开好），
      # 不要写 $RUNNER_TEMP：Windows 上 run 默认跑在 PowerShell 里，而 PowerShell 中
      # $RUNNER_TEMP 是未定义变量（环境变量得写 $env:RUNNER_TEMP），会展开成空字符串，
      # 路径变成盘根的 /artifacts —— 收集脚本照样成功，只是产物落到了别的目录，
      # 直到上传步骤才以「No files were found with the provided path」暴露出来。
      - name: Collect desktop bundles
        run: node scripts/collect-artifacts.mjs desktop --target ${{ matrix.target }} --out "${{ runner.temp }}/artifacts"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: readerx-${{ matrix.name }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, release-android, release-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 各平台产物先汇总再发布：`gh release create` 只跑一次，避免多个 job 抢同一个 release。
      # 各 artifact 里的文件名已带平台与架构（readerx-<版本>-<平台>-<架构>…，见
      # scripts/collect-artifacts.mjs），这里无需再按 artifact 名分目录。
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/assets

      # 发布说明 = scripts/tip.md（下载与安装说明，含各平台 / 架构与签名情况）+ CHANGELOG 对应区块
      # （版本区块缺失时回退到 [Unreleased]，口径见脚本内说明），拼接由 scripts/release-notes.mjs 负责：
      # 安装说明是随产物走的文案，改它不必动工作流。
      - name: Build release notes
        run: |
          node scripts/release-notes.mjs "${VERSION}" > "$RUNNER_TEMP/release-notes.md"
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release-assets"
          mkdir -p "$STAGE"
          mapfile -t FOUND < <(find "$RUNNER_TEMP/assets" -type f \
            \( -name '*.apk' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' \) | sort)
          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "::error::没有找到任何可发布的产物，检查各构建 job 的上传步骤。"
            exit 1
          fi
          # 文件名已含平台与架构，正常情况下不会有重名；真出现重名说明命名口径漏了区分维度，
          # 此时必须失败 —— 同一个 Release 里同名会被后上传的覆盖，用户拿到的包就错了。
          ASSETS=()
          declare -A SEEN=()
          for FILE in "${FOUND[@]}"; do
            NAME="$(basename "$FILE")"
            if [ -n "${SEEN[$NAME]:-}" ]; then
              echo "::error::产物重名 ${NAME}，检查 scripts/collect-artifacts.mjs 的命名口径。"
              exit 1
            fi
            SEEN[$NAME]=1
            cp "$FILE" "$STAGE/$NAME"
            ASSETS+=("$STAGE/$NAME")
            echo "asset: $NAME"
          done
          PRERELEASE=""
          case "${VERSION}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${TAG}" "${ASSETS[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ${PRERELEASE}
          echo "Released ${TAG} with ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"
