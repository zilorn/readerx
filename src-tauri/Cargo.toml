[package]
name = "readerx"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "readerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 单一 workspace：主 crate、书源网页登录插件、书源引擎核心 crate 共享同一 target 目录，
# 便于 tauri 移动端构建发现插件的 android 工程，也让独立二进制复用同一份依赖。
[workspace]
members = [".", "plugins/tauri-plugin-webview-login", "crates/readerx-source", "crates/readerx-log"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 桌面端设置页的「开发者工具」入口：转发到 tauri 的 devtools feature，
# release 包（AppImage / deb / NSIS）也要能打开检查器（debug 构建本来就带）。
# `--no-default-features` 构建时 `readerx_open_devtools` 会如实报「未启用」，
# 而不是让按钮点了没反应；Android 上该 API 是空实现，不受影响。
default = ["devtools"]
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
# 桌面端「导入本地书」用系统文件选择器（Android 走 SAF 的 input[type=file]）
tauri-plugin-dialog = "2"
tauri-plugin-tts = "0.1"
# 书源「网页登录」：Android 原生 WebView 登录浮层（仅移动端注册）
tauri-plugin-webview-login = { path = "plugins/tauri-plugin-webview-login" }
# 书源引擎（Boa 沙箱 + 宿主 HTTP/HTML/加密 API）：
# 同一份代码也编译成独立二进制（cargo build -p readerx-source --features cli），
# 供不启动 App 的离线调试与带登录态的站点验证使用。
readerx-source = { path = "crates/readerx-source" }
# 统一日志设施：级别过滤 + 文件轮转 + 标准错误 / Android logcat。
# 主 crate、书源引擎、独立二进制共用一份实现，业务代码只写 log::info! 这类门面宏。
readerx-log = { path = "crates/readerx-log" }
# log 门面：业务代码直接用 log::info! / log::warn! 写日志（readerx-log 负责输出）
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# 桌面端单实例：重复启动不再开出第二个进程，而是聚焦已在运行的那个窗口
# （两个实例会同时写同一份书库与设置）。插件不支持移动端，那边由系统保证单实例，
# 因此写进 target 段，Android / iOS 构建根本不编译它。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 用 unwind 而不是 abort：书源 JS（Boa 引擎）与第三方解析库内部的意外 panic 才能被
# panic_guard 的 catch_unwind 收敛成一条可读错误返回前端；abort 会直接杀进程，
# 用户只看到应用闪退、拿不到任何原因。（体积略增，换可诊断性）
panic = "unwind"
strip = true



















