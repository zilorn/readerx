[package]
name = "readerx"
version = "0.1.5-beta.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "readerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 单一 workspace：主 crate 与书源网页登录插件共享同一 target 目录，
# 便于 tauri 移动端构建发现插件的 android 工程。
[workspace]
members = [".", "plugins/tauri-plugin-webview-login"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-tts = "0.1"
# 书源「网页登录」：Android 原生 WebView 登录浮层（仅移动端注册）
tauri-plugin-webview-login = { path = "plugins/tauri-plugin-webview-login" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
boa_engine = { version = "0.22", default-features = false }
scraper = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "json", "rustls-tls"] }
encoding_rs = "0.8"
# 书源 JS 的摘要 / 签名 / 对称加密（cryptoUtil，见 docs/book-source-api.md）
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# 显式依赖 digest 只为在泛型 HMAC 辅助函数上写 Digest 约束、并统一取摘要 trait
# （md-5 / sha1 / sha2 都 re-export 同一份 digest 0.10，不存在重复版本）
digest = "0.10"
aes-gcm = "0.10"
# AES-GCM 未给 IV 时生成随机 12 字节（与 rand_core 0.6 / getrandom 0.2 同源，不新增体积）
getrandom = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 用 unwind 而不是 abort：书源 JS（Boa 引擎）与第三方解析库内部的意外 panic 才能被
# panic_guard 的 catch_unwind 收敛成一条可读错误返回前端；abort 会直接杀进程，
# 用户只看到应用闪退、拿不到任何原因。（体积略增，换可诊断性）
panic = "unwind"
strip = true














