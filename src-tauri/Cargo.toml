[package]
name = "readerx"
version = "0.1.5-beta.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "readerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 单一 workspace：主 crate、书源网页登录插件、书源引擎核心 crate 共享同一 target 目录，
# 便于 tauri 移动端构建发现插件的 android 工程，也让独立二进制复用同一份依赖。
[workspace]
members = [".", "plugins/tauri-plugin-webview-login", "crates/readerx-source"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-tts = "0.1"
# 书源「网页登录」：Android 原生 WebView 登录浮层（仅移动端注册）
tauri-plugin-webview-login = { path = "plugins/tauri-plugin-webview-login" }
# 书源引擎（Boa 沙箱 + 宿主 HTTP/HTML/加密 API）：
# 同一份代码也编译成独立二进制（cargo build -p readerx-source --features cli），
# 供不启动 App 的离线调试与带登录态的站点验证使用。
readerx-source = { path = "crates/readerx-source" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 用 unwind 而不是 abort：书源 JS（Boa 引擎）与第三方解析库内部的意外 panic 才能被
# panic_guard 的 catch_unwind 收敛成一条可读错误返回前端；abort 会直接杀进程，
# 用户只看到应用闪退、拿不到任何原因。（体积略增，换可诊断性）
panic = "unwind"
strip = true














