[package]
name = "readerx"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "readerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 单一 workspace：主 crate 与书源网页登录插件共享同一 target 目录，
# 便于 tauri 移动端构建发现插件的 android 工程。
[workspace]
members = [".", "plugins/tauri-plugin-webview-login"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-tts = "0.1"
# 书源「网页登录」：Android 原生 WebView 登录浮层（仅移动端注册）
tauri-plugin-webview-login = { path = "plugins/tauri-plugin-webview-login" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
boa_engine = { version = "0.22", default-features = false }
scraper = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "json", "rustls-tls"] }
encoding_rs = "0.8"
md-5 = "0.10"
sha1 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true









